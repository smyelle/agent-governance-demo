name: projects/${PROJECT_NUMBER}/locations/${REGION}/authzExtensions/cymbal-ma-content-authz
description: "Semantic Governance Plane (CONTENT_AUTHZ) binding Agent Gateway L7 payloads to fail-closed Model Armor GPP"
wireFormat: EXT_PROC_GRPC
authority: modelarmor.${REGION}.rep.googleapis.com
service: modelarmor.${REGION}.rep.googleapis.com
timeout: "5s"
failOpen: false
forwardHeaders:
  - traceparent
  - x-cymbal-session-id
  - x-cymbal-agent-id
metadata:
  model_armor_template: projects/${PROJECT_ID}/locations/${REGION}/templates/cymbal-default-medium-gpp
  strict_ag3_template: projects/${PROJECT_ID}/locations/${REGION}/templates/cymbal-strict-ag3-gpp
