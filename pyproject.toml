[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-governance-demo"
version = "2.0.0"
description = "Cymbal Platform Agent Governance, Optimization & Deployment Console on Google Agent Platform and ADK 2.0"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.14.0",
    "google-genai>=1.40.0",
    "google-cloud-aiplatform[agent_engines,adk]>=2.10.0",
    "google-cloud-modelarmor>=0.2.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-bigquery>=3.27.0",
    "google-cloud-trace>=1.14.0",
    "google-cloud-logging>=3.11.0",
    "google-auth>=2.36.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "mcp>=1.6.0",
    "a2a-sdk>=0.2.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "PyJWT>=2.10.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp-proto-http>=1.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
include = ["cymbal_agent*", "evals*", "services*", "web*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
