<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Build | Cymbal Agent Governance Platform</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css?v=20261125e">
</head>
<body>
  <a href="#center-workspace" class="skip-link visually-hidden">Skip to main content</a>
  <div id="polite-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

  <div class="app-shell">
    <aside class="left-rail">
      <div class="brand-header">
        <svg class="brand-icon" aria-hidden="true" viewBox="0 0 40 34">
          <defs>
            <linearGradient id="cymbal-media-mark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6D28D9"></stop>
              <stop offset="52%" stop-color="#EC4899"></stop>
              <stop offset="100%" stop-color="#2563EB"></stop>
            </linearGradient>
          </defs>
          <path d="M3 7.2C3 4.6 5.8 3 8.1 4.4l13.6 8.3c2.1 1.3 2.1 4.3 0 5.6L8.1 26.6C5.8 28 3 26.4 3 23.8V7.2z" fill="url(#cymbal-media-mark-grad)"></path>
          <path d="M25.5 9.2a11.5 11.5 0 0 1 0 12.6" fill="none" stroke="url(#cymbal-media-mark-grad)" stroke-width="3.2" stroke-linecap="round"></path>
          <path d="M31.2 5.2a17.5 17.5 0 0 1 0 20.6" fill="none" stroke="#2563EB" stroke-width="3.2" stroke-linecap="round"></path>
        </svg>
        <div id="sidebar-brand-title" class="brand-lockup">
          <span class="brand-wordmark">Cymbal</span>
          <span id="sidebar-brand-subtitle" class="brand-subword">Agent Governance Platform</span>
        </div>
      </div>

      <nav id="left-lifecycle-nav" class="lifecycle-nav" aria-label="Primary">
        <ul class="lifecycle-nav-list">
          <li>
            <button type="button" class="lifecycle-nav-btn is-active" data-stage="build" aria-current="page">
              <span class="nav-stage-label">Build</span>
            </button>
          </li>
          <li>
            <button type="button" class="lifecycle-nav-btn" data-stage="evaluate">
              <span class="nav-stage-label">Evaluate</span>
            </button>
          </li>
          <li>
            <button type="button" class="lifecycle-nav-btn" data-stage="deploy">
              <span class="nav-stage-label">Deploy</span>
            </button>
          </li>
          <li>
            <button type="button" class="lifecycle-nav-btn" data-stage="govern">
              <span class="nav-stage-label">Govern</span>
            </button>
          </li>
        </ul>
      </nav>
    </aside>

    <main id="center-workspace" class="main-workspace" tabindex="-1">
      <div id="global-alert-banner" class="alert-banner" role="alert" hidden></div>
      <div id="status-toast-banner" class="toast-banner" hidden></div>

      <div id="stage-body-content" class="stage-body"></div>

      <footer class="workspace-footer">
        <span>Cymbal Agent Governance Platform (Apache-2.0) | Foundation Model Standard: gemini-3.8-flash</span>
        <span>Cost figures represent non-binding engineering capacity models based on published cloud and enterprise unit rates.</span>
      </footer>
    </main>
  </div>

  <dialog id="agent-modal-dialog" class="center-modal" aria-labelledby="agent-modal-heading">
    <div class="modal-panel">
      <header class="modal-header">
        <h2 id="agent-modal-heading" class="modal-title">Register Agent</h2>
        <button type="button" id="close-agent-modal-btn" class="secondary-btn sm-btn">Cancel</button>
      </header>
      <div id="agent-modal-body" class="modal-body"></div>
    </div>
  </dialog>

  <script src="/static/app.js?v=20261125e" defer></script>
</body>
</html>
